<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}관리자 콘솔{% endblock %} · {{ app_name }}</title>
  <link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="관리자 내비게이션">
      <div class="brand">{{ app_name }}<small>운영 관리자 콘솔</small></div>
      <nav class="nav">
        <a href="/admin" {% if request.url.path == '/admin' %}aria-current="page"{% endif %}>대시보드</a>
        <a href="/admin/repositories" {% if request.url.path.startswith('/admin/repositories') %}aria-current="page"{% endif %}>저장소</a>
        <a href="/admin/jobs" {% if request.url.path.startswith('/admin/jobs') %}aria-current="page"{% endif %}>리뷰 작업</a>
        <a href="/admin/settings" {% if request.url.path == '/admin/settings' %}aria-current="page"{% endif %}>전역 설정</a>
        <a href="/admin/audit" {% if request.url.path == '/admin/audit' %}aria-current="page"{% endif %}>감사 로그</a>
      </nav>
      <div class="sidebar-footer">관리자: {{ principal.github_login }}<br>변경 사항은 감사 로그에 기록됩니다.</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="identity">{{ request.url.path }}</div>
        <form method="post" action="/auth/github/logout">
          <input type="hidden" name="_csrf" value="{{ csrf_token }}">
          <button class="button secondary" type="submit">로그아웃</button>
        </form>
      </header>
      <main class="content">{% block content %}{% endblock %}</main>
    </div>
  </div>
</body>
</html>
