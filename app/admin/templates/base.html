<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}관리자 콘솔{% endblock %} · {{ app_name }}</title>
  <link rel="stylesheet" href="/admin/static/admin.css?v=20260908">
</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
  <div class="shell">
    <aside class="sidebar" aria-label="주 메뉴">
      <div class="brand"><span class="brand-mark" aria-hidden="true">◆</span><span>{{ app_name }}</span><small>운영 콘솔</small></div>
      <nav class="nav" aria-label="관리 메뉴">
        <a href="/admin" {% if request.url.path == '/admin' %}aria-current="page"{% endif %}>대시보드</a>
        <a href="/admin/repositories" {% if request.url.path.startswith('/admin/repositories') %}aria-current="page"{% endif %}>저장소</a>
        <a href="/admin/jobs" {% if request.url.path.startswith('/admin/jobs') %}aria-current="page"{% endif %}>리뷰 작업</a>
        <a href="/admin/audit" {% if request.url.path == '/admin/audit' %}aria-current="page"{% endif %}>이벤트 · 감사</a>
        <a href="/admin/operations" {% if request.url.path.startswith('/admin/operations') %}aria-current="page"{% endif %}>운영</a>
        <a href="/admin/settings" {% if request.url.path == '/admin/settings' %}aria-current="page"{% endif %}>설정</a>
      </nav>
      <div class="sidebar-footer"><span class="muted-label">로그인 사용자</span><strong>{{ principal.github_login }}</strong><form method="post" action="/auth/github/logout"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><button class="button ghost" type="submit">로그아웃</button></form></div>
    </aside>
    <div class="main">
      <header class="topbar"><div class="topbar-title">{{ app_name }} <span>/</span> 운영</div><div class="topbar-meta">{{ principal.github_login }} · 관리자</div></header>
      <main id="main-content" class="content">{% block content %}{% endblock %}</main>
    </div>
  </div>
</body>
</html>
