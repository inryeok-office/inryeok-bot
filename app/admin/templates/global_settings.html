{% extends "base.html" %}{% block content %}<h1>Global review settings</h1><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><p><label><input type="checkbox" name="enabled" value="true" {% if global_settings.enabled %}checked{% endif %}> enabled</label> <label><input type="checkbox" name="auto_review_enabled" value="true" {% if global_settings.auto_review_enabled %}checked{% endif %}> automatic review</label> <label><input type="checkbox" name="command_review_enabled" value="true" {% if global_settings.command_review_enabled %}checked{% endif %}> command review</label></p><p><label>Language <select name="language"><option value="ko" {% if global_settings.language == 'ko' %}selected{% endif %}>ko</option><option value="en" {% if global_settings.language == 'en' %}selected{% endif %}>en</option></select></label> <label>Profile <select name="review_profile">{% for value in ['CONSERVATIVE','BALANCED','THOROUGH'] %}<option value="{{ value }}" {% if global_settings.review_profile == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label> <label>Model <select name="model"><option value="">Codex default</option>{% for value in models %}<option value="{{ value }}" {% if global_settings.model == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label></p><p><label>Max findings <input name="max_findings" type="number" min="1" max="50" value="{{ global_settings.max_findings }}"></label> <label>Minimum confidence <input name="minimum_confidence" type="number" step="0.01" min="0.8" max="1" value="{{ global_settings.minimum_confidence }}"></label> <label>Timeout <input name="codex_timeout_seconds" type="number" min="30" max="3600" value="{{ global_settings.codex_timeout_seconds }}"></label></p><p><label><input type="checkbox" name="include_low_severity" value="true" {% if global_settings.include_low_severity %}checked{% endif %}> include LOW</label> <label>Minimum severity <select name="minimum_severity">{% for value in ['CRITICAL','HIGH','MEDIUM','LOW'] %}<option value="{{ value }}" {% if global_settings.minimum_severity == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label></p><p><label>Enabled categories (comma-separated; empty = all)<br><input name="enabled_categories" value="{{ global_settings.enabled_categories }}" size="70"></label></p><p><strong>Automatic triggers</strong><br><label><input type="checkbox" name="review_on_opened" value="true" {% if global_settings.review_on_opened %}checked{% endif %}> opened</label> <label><input type="checkbox" name="review_on_reopened" value="true" {% if global_settings.review_on_reopened %}checked{% endif %}> reopened</label> <label><input type="checkbox" name="review_on_ready_for_review" value="true" {% if global_settings.review_on_ready_for_review %}checked{% endif %}> ready for review</label> <label><input type="checkbox" name="review_on_synchronize" value="true" {% if global_settings.review_on_synchronize %}checked{% endif %}> synchronize</label></p><p><label>Ignored paths<br><textarea name="ignored_paths" rows="6" cols="70">{{ global_settings.ignored_paths }}</textarea></label></p><button>Save</button></form>{% endblock %}
