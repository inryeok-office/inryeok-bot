{% extends "base.html" %}
{% block title %}리뷰 작업{% endblock %}
{% block content %}
<div class="page-head"><div><h1>리뷰 작업</h1><p>처리 상태와 안전한 오류 진단을 확인합니다.</p></div></div>
<div class="card filter-bar"><form class="filter-form" method="get"><div class="field"><label for="repository">저장소</label><input id="repository" name="repository" value="{{ repository_filter or '' }}" placeholder="owner/name"></div><div class="field"><label for="status">상태</label><select id="status" name="status_filter"><option value="">모든 상태</option>{% for value,label in [('PENDING','대기'),('RUNNING','실행 중'),('SUCCEEDED','성공'),('FAILED','실패'),('SKIPPED','건너뜀')] %}<option value="{{ value }}" {% if status_filter == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="field"><label for="error_code">오류 코드</label><input id="error_code" name="error_code" value="{{ error_code_filter or '' }}"></div><div class="field"><label for="error_stage">실패 단계</label><input id="error_stage" name="error_stage" value="{{ error_stage_filter or '' }}"></div><div class="actions"><button class="button primary" type="submit">필터 적용</button><a class="button secondary" href="/admin/jobs">초기화</a></div></form></div>
<div class="banner" role="note"><strong>민감정보는 표시하지 않습니다.</strong> 원본 prompt, source, stdout/stderr, token과 credential은 운영 화면에 저장하거나 표시하지 않습니다.</div>
{% include "_jobs.html" %}
{% endblock %}
