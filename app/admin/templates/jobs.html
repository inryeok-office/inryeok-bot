{% extends "base.html" %}
{% block title %}리뷰{% endblock %}
{% block content %}
<div class="page-head"><div><p class="eyebrow">리뷰</p><h1>리뷰 작업</h1><p>처리 중인 작업과 조치가 필요한 실패를 먼저 확인합니다.</p></div><div class="subnav" aria-label="리뷰 메뉴"><a aria-current="page" href="/admin/jobs">작업</a><a href="/admin/usage">사용량·성공률</a></div></div>
<section class="card filter-bar"><form class="filter-form" method="get"><div class="field"><label for="repository">저장소</label><input id="repository" name="repository" value="{{ repository_filter or '' }}" placeholder="owner/name"></div><div class="field"><label for="status">상태</label><select id="status" name="status_filter"><option value="">모든 상태</option>{% for value,label in [('PENDING','대기 중'),('RUNNING','처리 중'),('SUCCEEDED','성공'),('FAILED','실패'),('SKIPPED','건너뜀')] %}<option value="{{ value }}" {% if status_filter == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="field optional-filter"><label for="error_stage">실패 단계</label><input id="error_stage" name="error_stage" value="{{ error_stage_filter or '' }}" placeholder="예: validation"></div><div class="actions"><button class="button primary" type="submit">필터 적용</button><a class="button secondary" href="/admin/jobs">초기화</a></div></form></section>
<div class="notice info" role="note"><strong>안전한 운영 정보만 표시합니다.</strong><span>원본 prompt, source, stdout/stderr, token과 credential은 콘솔에 표시하지 않습니다.</span></div>
<section class="section" aria-labelledby="job-list-title"><div class="section-head"><h2 id="job-list-title">최근 작업</h2><span class="muted">최대 100건</span></div>{% include "_jobs.html" %}</section>
{% endblock %}
