{% extends "base.html" %}{% block content %}<h1>Repositories</h1><table><thead><tr><th>Repository</th><th>Installed</th><th>Enabled</th><th>Auto review</th></tr></thead><tbody>{% for repo in repositories %}<tr><td><a href="/admin/repositories/{{ repo.id }}">{{ repo.repository_owner }}/{{ repo.repository_name }}</a></td><td>{{ repo.installed }}</td><td>{{ repo.enabled }}</td><td>{{ repo.auto_review }}</td></tr>{% else %}<tr><td colspan="4">No repositories</td></tr>{% endfor %}</tbody></table>{% endblock %}
