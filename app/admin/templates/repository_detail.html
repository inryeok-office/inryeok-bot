{% extends "base.html" %}{% block content %}<h1>{{ repository.repository_owner }}/{{ repository.repository_name }}</h1><p class="muted">GitHub App installed: {{ repository.installed }}</p><form method="post" action="/admin/repositories/{{ repository.id }}/settings"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><p><label><input type="checkbox" name="enabled" value="true" {% if repository.enabled %}checked{% endif %}> enabled</label> <label><input type="checkbox" name="auto_review" value="true" {% if repository.auto_review %}checked{% endif %}> auto review</label> <label><input type="checkbox" name="ignore_draft" value="true" {% if repository.ignore_draft %}checked{% endif %}> ignore draft</label> <label><input type="checkbox" name="include_low_severity" value="true" {% if repository.include_low_severity %}checked{% endif %}> include LOW</label></p><p><label>min confidence <input type="number" step="0.01" min="0" max="1" name="min_confidence" value="{{ repository.min_confidence }}"></label> <label>max findings <input type="number" min="1" max="50" name="max_findings" value="{{ repository.max_findings }}"></label></p><p><label>Ignore patterns<br><textarea name="ignore_patterns" rows="10" cols="70">{{ repository.ignore_patterns }}</textarea></label></p><button {% if not repository.installed %}disabled{% endif %}>Save</button></form>{% endblock %}
