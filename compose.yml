x-logging: &default-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
x-app-runtime: &app-runtime
  image: inryeok-bot:0.1.0
  secrets:
    - source: github_app_private_key
      target: github-app.pem
      mode: "0444"
  env_file:
    - path: .env.example
    - path: .env
      required: false
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging: *default-logging
  depends_on:
    postgres: {condition: service_healthy}
  deploy:
    resources:
      limits: {cpus: "1.0", memory: 1G}

services:
  web:
    <<: *app-runtime
    build:
      context: .
      args: {PYTHON_VERSION: "3.13"}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app-runtime
    command: ["python", "-m", "app.jobs.worker"]
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - review-work:/var/lib/review-bot/work
      - type: bind
        source: ${EXECUTOR_SOCKET_DIR_HOST:-/run/inryeok-bot}
        target: /run/inryeok-bot
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys;sys.exit(b'app.jobs.worker' not in pathlib.Path('/proc/1/cmdline').read_bytes())"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 2G}

  postgres:
    image: postgres:17.7-bookworm@sha256:86e0b703649d7a792bd9243ee28afc9d8f7c6b2b5638077c9d6882d4d472bbfd
    environment:
      POSTGRES_DB: reviewbot
      POSTGRES_USER: reviewbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewbot -d reviewbot"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # The official entrypoint needs these capabilities to chown the data
    # directory and drop privileges to the postgres user during initialization.
    cap_add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE"]
    logging: *default-logging
    deploy:
      resources:
        limits: {cpus: "0.75", memory: 768M}

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    environment: {DOMAIN: "${DOMAIN:-localhost}"}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      # The public hostname is required for Caddy's TLS SNI, which is not
      # available from an in-container localhost probe. Verify the upstream
      # health endpoint here and validate the public HTTPS route separately.
      test: ["CMD", "wget", "--spider", "--quiet", "http://web:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # Caddy's non-root entrypoint must switch to its service user and bind
    # the public HTTP/HTTPS ports.
    cap_add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE", "NET_BIND_SERVICE"]
    logging: *default-logging
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128M}

volumes:
  postgres-data:
  review-work:
  caddy-data:
  caddy-config:

secrets:
  github_app_private_key:
    file: "${GITHUB_PRIVATE_KEY_HOST_PATH}"
